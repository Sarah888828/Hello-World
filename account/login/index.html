<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10110f" />
    <meta name="description" content="불당 주차 계정으로 로그인합니다." />
    <meta property="og:title" content="로그인 | 불당 주차" />
    <meta property="og:description" content="불당 주차 로그인 화면을 확인하세요." />
    <meta property="og:type" content="website" />
    <title>로그인 | 불당 주차</title>
    <link rel="stylesheet" href="../../style.css?theme=black-v2" />
  </head>
  <body>
    <header class="topbar">
      <div data-site-navigation></div>
    </header>

    <main class="account-page account-login-page">
      <a class="detail-back" href="../../"><span aria-hidden="true">←</span> 메인으로</a>
      <section class="account-card" aria-labelledby="login-title">
        <div class="account-heading">
          <span class="account-mark" aria-hidden="true">P</span>
          <p class="section-kicker">WELCOME BACK</p>
          <h1 id="login-title">로그인</h1>
          <p>불당 주차 계정으로 계속 이용해 보세요.</p>
        </div>
        <div class="account-demo-notice" role="note"><strong>보안 안내</strong> — 비밀번호는 서버에서 해시와 비교합니다. 로그인 성공 여부는 확인되지만, 로그인 상태 유지와 보호된 페이지 기능은 아직 연결되어 있지 않습니다.</div>
        <form id="login-form" class="account-form" novalidate>
          <label class="form-field" for="login-email"><span>이메일 주소</span><input id="login-email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required /></label>
          <label class="form-field" for="login-password"><span>비밀번호</span><input id="login-password" name="password" type="password" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password" required /></label>
          <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
          <button class="account-submit" type="submit">로그인 <span aria-hidden="true">→</span></button>
        </form>
        <p class="account-switch">아직 계정이 없으신가요? <a href="../signup/">회원가입</a></p>
      </section>
    </main>

    <footer class="footer"><a class="brand footer-brand" href="../../"><span class="brand-mark" aria-hidden="true">P</span><span>불당<span class="brand-light">주차</span></span></a><p>로그인 인증은 가능하지만 세션 기능은 아직 제공하지 않습니다.</p><a href="../../#home" class="to-top">메인으로 ↑</a></footer>
    <script src="login.js" defer></script>
    <script src="../../nav.js" defer></script>
  </body>
</html>
