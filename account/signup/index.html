<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10110f" />
    <meta name="description" content="불당 주차 회원가입 화면 시안입니다. 닉네임, 이메일, 성별, 집주소 정보를 입력하는 정적 페이지입니다." />
    <meta property="og:title" content="회원가입 | 불당 주차" />
    <meta property="og:description" content="불당 주차 회원가입 화면을 확인하세요." />
    <meta property="og:type" content="website" />
    <title>회원가입 | 불당 주차</title>
    <link rel="stylesheet" href="../../style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="../../" aria-label="불당 주차 메인"><span class="brand-mark" aria-hidden="true">P</span><span>불당<span class="brand-light">주차</span></span></a>
      <nav class="topnav" aria-label="주 메뉴">
        <a class="nav-link" href="../../#parking-list">주차장 찾기</a>
        <a class="nav-link" href="../../board/">문의 게시판</a>
        <a class="nav-link" href="../login/">로그인</a>
        <a class="nav-link active" href="./" aria-current="page">회원가입</a>
      </nav>
      <a class="location-pill" href="https://map.naver.com/p/search/천안%20불당동%20공영주차장" target="_blank" rel="noreferrer"><span class="location-dot" aria-hidden="true"></span> 천안시 불당동</a>
    </header>

    <main class="account-page">
      <a class="detail-back" href="../../"><span aria-hidden="true">←</span> 메인으로</a>
      <section class="account-card" aria-labelledby="signup-title">
        <div class="account-heading">
          <span class="account-mark" aria-hidden="true">P</span>
          <p class="section-kicker">CREATE YOUR ACCOUNT</p>
          <h1 id="signup-title">회원가입</h1>
          <p>불당 주차 서비스를 이용할 계정을 만들어 보세요.</p>
        </div>

        <div class="account-demo-notice" role="note"><strong>화면 시안</strong> — HTML·CSS 전용 페이지입니다. 가입 버튼은 실제 계정 생성이나 데이터 전송을 하지 않습니다. 개인정보를 실제로 입력하지 마세요.</div>

        <form class="account-form" action="#" method="get">
          <label class="form-field" for="signup-nickname"><span>닉네임 <b aria-hidden="true">*</b></span><input id="signup-nickname" name="nickname" type="text" minlength="2" maxlength="24" placeholder="사용할 닉네임" autocomplete="nickname" required /></label>
          <label class="form-field" for="signup-email"><span>이메일 주소 <b aria-hidden="true">*</b></span><input id="signup-email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required /></label>
          <label class="form-field" for="signup-password"><span>비밀번호 <b aria-hidden="true">*</b></span><input id="signup-password" name="password" type="password" minlength="8" placeholder="8자 이상 입력해 주세요" autocomplete="new-password" required /></label>
          <fieldset class="account-gender">
            <legend>성별 <b aria-hidden="true">*</b></legend>
            <label><input type="radio" name="gender" value="female" required /><span>여성</span></label>
            <label><input type="radio" name="gender" value="male" /><span>남성</span></label>
            <label><input type="radio" name="gender" value="other" /><span>기타</span></label>
            <label><input type="radio" name="gender" value="undisclosed" /><span>선택 안 함</span></label>
          </fieldset>
          <label class="form-field" for="signup-address"><span>집주소 <b aria-hidden="true">*</b></span><input id="signup-address" name="address" type="text" maxlength="200" placeholder="도로명 주소를 입력해 주세요" autocomplete="street-address" required /></label>
          <label class="account-terms"><input type="checkbox" name="terms" required /><span>이용약관 및 개인정보 안내를 확인했습니다. <b aria-hidden="true">*</b></span></label>
          <button class="account-submit" type="button" disabled>가입하기 <span aria-hidden="true">→</span></button>
        </form>

        <p class="account-switch">이미 계정이 있으신가요? <a href="../login/">로그인</a></p>
      </section>
    </main>

    <footer class="footer"><a class="brand footer-brand" href="../../"><span class="brand-mark" aria-hidden="true">P</span><span>불당<span class="brand-light">주차</span></span></a><p>회원가입 화면 시안 · 정보가 저장되거나 전송되지 않습니다.</p><a href="../../#home" class="to-top">메인으로 ↑</a></footer>
  </body>
</html>
